name: Diagnose ruff failures

on:
  push:
    branches:
      - claude/inference-comparison-4vlt4q
    paths:
      - .github/workflows/diagnose-ruff.yml
      - src/nns/**
      - tests/**
      - examples/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/inference-comparison-4vlt4q
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install -q ruff

      - name: Capture ruff output
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          ruff check . > diagnostics/ruff.log 2>&1
          status=$?
          echo "OVERALL EXIT CODE: ${status}" >> diagnostics/ruff.log
          echo "${status}" > diagnostics/ruff.status
          exit 0

      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/ruff.log diagnostics/ruff.status
          if git diff --cached --quiet; then
            echo "Diagnostic output unchanged."
          else
            git commit -m "Record ruff diagnostic output"
            git push origin HEAD:claude/inference-comparison-4vlt4q
          fi
