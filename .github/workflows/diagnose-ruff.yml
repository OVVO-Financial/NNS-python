name: Diagnose ruff failures

on:
  push:
    branches:
      - claude/inference-comparison-4vlt4q
    paths:
      - .github/workflows/diagnose-ruff.yml
      - src/nns/**
      - tests/**
      - examples/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/inference-comparison-4vlt4q
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install -q ruff

      - name: Apply safe ruff fixes and capture remaining output
        shell: bash
        run: |
          set +e
          ruff check . --fix
          mkdir -p diagnostics
          ruff check . > diagnostics/ruff.log 2>&1
          status=$?
          echo "OVERALL EXIT CODE: ${status}" >> diagnostics/ruff.log
          echo "${status}" > diagnostics/ruff.status
          exit 0

      - name: Commit fixes and diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests examples diagnostics/ruff.log diagnostics/ruff.status
          if git diff --cached --quiet; then
            echo "No safe fixes or diagnostic changes."
          else
            git commit -m "Apply safe ruff fixes and record remaining findings"
            git push origin HEAD:claude/inference-comparison-4vlt4q
          fi
