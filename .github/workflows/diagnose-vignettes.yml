name: Diagnose vignette failures

on:
  push:
    branches:
      - claude/inference-comparison-4vlt4q
    paths:
      - .github/workflows/diagnose-vignettes.yml
      - examples/vignettes/**
      - tests/docs/test_vignette_examples.py
      - src/nns/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/inference-comparison-4vlt4q
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dependencies
        run: |
          python -m pip install -q -U pip
          python -m pip install -q build scikit-build-core nanobind pytest "numpy<2.5" scipy matplotlib hypothesis pytest-benchmark pytest-xdist
          python -m pip install -q -e .

      - name: Capture every vignette independently
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/vignette.log
          status=0
          for script in examples/vignettes/*.py; do
            {
              echo
              echo "============================================================"
              echo "RUNNING: ${script}"
              echo "============================================================"
              python "${script}"
              rc=$?
              echo "EXIT CODE: ${rc}"
            } >> diagnostics/vignette.log 2>&1
            if [ "${rc}" -ne 0 ]; then
              status=1
            fi
          done
          echo "OVERALL EXIT CODE: ${status}" >> diagnostics/vignette.log
          echo "${status}" > diagnostics/vignette.status
          exit 0

      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/vignette.log diagnostics/vignette.status
          if git diff --cached --quiet; then
            echo "Diagnostic output unchanged."
          else
            git commit -m "Record vignette diagnostic output"
            git push origin HEAD:claude/inference-comparison-4vlt4q
          fi
