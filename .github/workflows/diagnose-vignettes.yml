name: Diagnose vignette failures

on:
  push:
    branches:
      - claude/inference-comparison-4vlt4q

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies quietly
        run: |
          python -m pip install -U pip >/tmp/pip-upgrade.log 2>&1
         