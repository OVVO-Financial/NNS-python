name: Diagnose vignette failures

on:
  push:
    branches:
      - claude/inference-comparison-4vlt4q
    paths:
      - .github/workflows/diagnose-vignettes.yml
      - examples/vignettes/**
      - tests/docs/test_vignette_examples.py
      - src/nns/**

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dependencies
        run: |
          python -m pip install -U pip
          python -m pip install build scikit-build-core nanobind pytest "numpy<2.5" scipy matplotlib hypothesis pytest-benchmark pytest-xdist
          python -m pip install -e .

      - name: Run every vignette independently
        shell: bash
        run: |
          set +e
          status=0
          for script in examples/vignettes/*.py; do
            echo
            echo "============================================================"
            echo "RUNNING: ${script}"
            echo "============================================================"
            python "${script}"
            rc=$?
            echo "EXIT CODE: ${rc}"
            if [ "${rc}" -ne 0 ]; then
              status=1
            fi
          done
          exit "${status}"
