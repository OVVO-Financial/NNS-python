name: Canonical vignette examples

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  canonical-vignettes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install -q -U pip
          python -m pip install -q -e . pytest
      - name: Run canonical vignette checks
        run: python -m pytest -q tests/docs/test_canonical_vignette_manifest.py tests/docs/test_vignette_examples.py
