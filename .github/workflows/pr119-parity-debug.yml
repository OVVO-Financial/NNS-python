name: PR119 parity debug

on:
  push:
    branches:
      - automation/r-cache-nns-13.1

permissions:
  contents: read

jobs:
  parity-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test environment
        run: |
          python -m pip install -U pip
          python -m pip install build scikit-build-core nanobind pytest "numpy<2.5" scipy
          python -m pip install hypothesis pytest-benchmark pytest-xdist
          python -m pip install -e .

      - name: Run parity and capture complete output
        shell: bash
        run: |
          set +e
          NNS_R_CACHE_ONLY=1 python -m pytest -vv tests/parity > parity-full.log 2>&1
          status=$?
          cat parity-full.log
          echo "$status" > parity-exit-code.txt
          exit 0

      - name: Upload parity diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr119-parity-full-log
          path: |
            parity-full.log
            parity-exit-code.txt
          if-no-files-found: error
