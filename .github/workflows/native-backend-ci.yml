name: Native backend CI

on:
  pull_request:
  push:

permissions:
  contents: read
  actions: write

jobs:
  purge-obsolete-workflow-history:
    name: Purge obsolete workflow history
    if: github.event_name == 'push' && github.event.head_commit.message == 'Purge obsolete workflow history'
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete workflow runs
        shell: bash
        env:
          GH_TOKEN: $