name: Diagnose mypy failures

on:
  push:
    branches:
      - claude/inference-comparison-4vlt4q
    paths:
      - .github/workflows/diagnose-mypy.yml
      - src/nns/**
      - tests/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/inference-comparison-4vlt4q
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and mypy dependencies
        run: |
          python -m pip install -q -U pip
          python -m pip install -q scikit-build-core nanobind mypy "numpy<2.5" scipy matplotlib hypothesis pytest pytest-benchmark pytest-xdist
          python -m pip install -q -e .

      - name: Capture mypy output
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          mypy > diagnostics/mypy.log 2>&1
          status=$?
          echo "OVERALL EXIT CODE: ${status}" >> diagnostics/mypy.log
          echo "${status}" > diagnostics/mypy.status
          exit 0

      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/mypy.log diagnostics/mypy.status
          if git diff --cached --quiet; then
            echo "Diagnostic output unchanged."
          else
            git commit -m "Record mypy diagnostic output"
            git push origin HEAD:claude/inference-comparison-4vlt4q
          fi
