name: Apply PR118 source parity fixes
on:
  push:
    branches: [automation/r-cache-nns-13.1]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Apply PR118 source parity fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/r-cache-nns-13.1
          fetch-depth: 0
      - name: Patch source and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/nns/seasonality.py'); s=p.read_text()
          old='''def _mean(values: NDArray[np.float64]) -> float:\n    if values.size >= 16:\n        mean = float(np.sum(values)) / float(values.size)\n        if abs(mean) > 1e-12:\n            return mean\n    total = 0.0\n    for value in values:\n        total += float(value)\n    return total / float(values.size)\n'''
          new='''def _mean(values: NDArray[np.float64]) -> float:\n    # Match R NNS_seas_cpp::vec_mean exactly: sequential accumulation.\n    total = 0.0\n    for value in values:\n        total += float(value)\n    return total / float(values.size)\n'''
          if old not in s: raise SystemExit('seasonality _mean pattern missing')
          s=s.replace(old,new)
          old='''def _sample_sd_from_mean(values: NDArray[np.float64], mean: float, *, exact: bool = False) -> float:\n    if not exact and values.size >= 16 and abs(mean) > 1e-12:\n        ss = float(np.dot(values, values)) - float(values.size) * mean * mean\n        if ss < 0.0:\n            ss = 0.0\n    else:\n        ss = 0.0\n        for value in values:\n            delta = float(value) - mean\n            ss += delta * delta\n    return math.sqrt(ss / float(values.size - 1))\n'''
          new='''def _sample_sd_from_mean(values: NDArray[np.float64], mean: float, *, exact: bool = False) -> float:\n    del exact\n    # Match R NNS_seas_cpp::vec_sd exactly: sequential squared deviations.\n    ss = 0.0\n    for value in values:\n        delta = float(value) - mean\n        ss += delta * delta\n    return math.sqrt(ss / float(values.size - 1))\n'''
          if old not in s: raise SystemExit('seasonality sd pattern missing')
          p.write_text(s.replace(old,new))
          p=Path('src/nns/stack.py'); s=p.read_text()
          old='scores[col] = abs(round(_pearson(_rank_average(x[:, col]), y_rank), 2))'
          new='scores[col] = abs(_pearson(_rank_average(x[:, col]), y_rank))'
          if old not in s: raise SystemExit('spearman pattern missing')
          p.write_text(s.replace(old,new))
          Path('tests/invariants/test_pr118_debug.py').unlink(missing_ok=True)
          Path('.github/workflows/pr118-source-fix.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/nns/seasonality.py src/nns/stack.py tests/invariants/test_pr118_debug.py .github/workflows/pr118-source-fix.yml
          git commit -m 'Match R 13.1 seasonality and Spearman precision'
          git push origin HEAD:automation/r-cache-nns-13.1