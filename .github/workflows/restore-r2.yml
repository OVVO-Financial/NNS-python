name: Restore Racine-Hastie R2

on:
  push:
    branches:
      - claude/inference-comparison-4vlt4q
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/inference-comparison-4vlt4q
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test tools
        run: |
          python -m pip install -U pip
          python -m pip install build scikit-build-core nanobind pytest ruff mypy "numpy<2.5" scipy
          python -m pip install hypothesis pytest-benchmark pytest-xdist
          python -m pip install -e .

      - name: Apply guarded implementation and cache migration
        run: python scripts/restore_racine_hastie_r2.py

      - name: Run validation gates and record each result
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics

          python -m pytest -q tests/invariants/test_racine_hastie_r2.py tests/property/test_regression.py tests/property/test_multivariate_regression.py > diagnostics/r2-test.log 2>&1
          echo "$?" > diagnostics/r2-test.status

          if [ "$(cat diagnostics/r2-test.status)" = "0" ]; then
            NNS_R_CACHE_ONLY=1 python -m pytest -q tests/parity > diagnostics/parity.log 2>&1
            echo "$?" > diagnostics/parity.status
            ruff check . > diagnostics/ruff.log 2>&1
            echo "$?" > diagnostics/ruff.status
            mypy > diagnostics/mypy.log 2>&1
            echo "$?" > diagnostics/mypy.status
          else
            echo "skipped" > diagnostics/parity.status
            echo "skipped" > diagnostics/ruff.status
            echo "skipped" > diagnostics/mypy.status
          fi

          cat diagnostics/r2-test.log
          [ -f diagnostics/parity.log ] && cat diagnostics/parity.log
          [ -f diagnostics/ruff.log ] && cat diagnostics/ruff.log
          [ -f diagnostics/mypy.log ] && cat diagnostics/mypy.log
          exit 0

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          focused=$(cat diagnostics/r2-test.status)
          parity=$(cat diagnostics/parity.status)
          ruff=$(cat diagnostics/ruff.status)
          mypy=$(cat diagnostics/mypy.status)
          if [ "${focused}" = "0" ] && [ "${parity}" = "0" ] && [ "${ruff}" = "0" ] && [ "${mypy}" = "0" ]; then
            git rm .github/workflows/restore-r2.yml scripts/restore_racine_hastie_r2.py diagnostics/r2-test.log diagnostics/r2-test.status
            git rm -f diagnostics/parity.log diagnostics/parity.status diagnostics/ruff.log diagnostics/ruff.status diagnostics/mypy.log diagnostics/mypy.status
            git add src tests
            git commit -m "Restore bounded Racine-Hastie R2 for NNS regression"
          else
            git add diagnostics
            git commit -m "Record Racine-Hastie R2 validation failure"
          fi
          git push origin HEAD:claude/inference-comparison-4vlt4q
